[project]
name = "whatsapp-mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0",
    "requests>=2.32.3",
]

# Os testes de multiconta usam parametrize e fixture de pytest. O pytest roda
# tambem os testes em estilo unittest que ja existiam, entao declarar aqui
# alinha a CI com o comando que os criterios do plano sempre usaram.
[dependency-groups]
dev = [
    "pytest>=8.0",
]
