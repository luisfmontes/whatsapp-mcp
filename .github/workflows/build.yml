name: build

# The SQLite layer is split by build tag: mattn/go-sqlite3 (CGO) on macOS/Linux,
# modernc.org/sqlite (pure Go) on Windows. A local `go build` therefore compiles
# only one of the two halves, and a compile error in the other one passes every
# check on the developer's machine — that is exactly how an unused import once
# shipped a broken macOS/Linux build from a Windows checkout. This workflow is
# the guarantee that cannot be forgotten.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  bridge:
    name: bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel the other platforms: knowing whether a failure is
      # platform-specific is the whole point.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cgo: '1'
          - os: macos-latest
            cgo: '1'
          # Windows must build with CGO off — that is the supported path there,
          # and it proves no C toolchain is needed.
          - os: windows-latest
            cgo: '0'
    defaults:
      run:
        working-directory: whatsapp-bridge
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Runs TestSQLiteLayer on both driver implementations: foreign keys, the
      # unaccent() SQL function (including the NULL argument that used to fail
      # under CGO only), and read-only enforcement.
      - name: test
        run: go test ./...

      # The race detector needs CGO, so it can only run on the two jobs that
      # have it — which is also why it cannot run on the maintainer's Windows
      # machine, where the whole point of the port is needing no C toolchain.
      # Without this step, the shared state between the watchdog goroutine, the
      # whatsmeow event callback and /api/status is only ever checked by reading.
      # Detection is probabilistic, so -count=3 buys a few more interleavings:
      # a reintroduced unsynchronized read was caught in 3 of 6 single runs.
      - name: test with race detector
        if: matrix.cgo == '1'
        run: go test -race -count=3 ./...

  gofmt:
    # Linux only: the Windows runner checks out with CRLF, which gofmt reports as
    # unformatted for every file, so running this on all three would be noise.
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: whatsapp-bridge/go.sum
      - name: gofmt -l
        working-directory: whatsapp-bridge
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

  mcp-server:
    name: mcp server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: whatsapp-mcp-server
    steps:
      - uses: actions/checkout@v7

      # Versao exata, nao alias de major: astral-sh/setup-uv publica tag movel
      # apenas ate v7 (v8 e v9 existem so como versao completa), e apontar para
      # @v9 falha na resolucao da action, no passo "Set up job".
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: whatsapp-mcp-server/uv.lock

      # Os testes de roteamento por conta sobem processos REAIS do bridge, em
      # portas distintas, e para isso compilam o binario. Sem Go aqui eles
      # quebram com FileNotFoundError: 'go'. Pular seria pior: o que esses
      # testes provam -- que a chamada foi para a conta certa -- so se prova
      # com processo de verdade.
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: sync
        run: uv sync

      # These cover the path-resolution logic, where a POSIX-only assumption
      # (comparing against a "/"-separated suffix) already slipped through once.
      - name: pytest
        run: uv run python -m pytest -q

  personal-data:
    # Um numero de telefone real chegou a este repositorio publico em 2026-08-08,
    # colado num progress.jsonl como evidencia de smoke, e ficou 16 dias no ar.
    # Reescrever o historico depois nao removeu de vez: em rede de fork o objeto
    # continua sendo servido por SHA. O momento barato de pegar e antes do merge.
    name: personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: check for new phone numbers and JIDs
        run: python scripts/check-personal-data.py
